[project]
name = "oaken-core"
version = "0.0.0"
description = "Oaken Core: an async pipeline and plugin loader. Products (mail, grove) are plugins on it."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE*"]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "platformdirs>=4.13.5",
    "pydantic>=2.14.1",
    "starlette>=1.9.0",
    "tomlkit>=0.13.2",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "openapi-spec-validator"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaken_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
