[project]
name = "oaken-core"
version = "1.0.0"
description = "Oaken Core: an async pipeline and plugin loader. Products (mail, grove) are plugins on it."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE*"]
readme = "README.md"
keywords = ["pipeline", "plugins", "async", "mcp", "llm", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.15.1",
    "mcp>=1.0",
    "uvicorn>=0.54.0",
    "packaging>=24.0",
    "aiosqlite>=0.22.1",
    "platformdirs>=4.13.5",
    "pydantic>=2.14.1",
    "starlette>=1.9.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "tomlkit>=0.13.2",
    "sqlite-vec>=0.1.9",
    "keyring>=25.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "openapi-spec-validator",
    "sqlc-bin>=1.31.1.post1",
]
# Site tooling (docs/tools). The core runtime must not depend on it.
docs = ["markdown-it-py", "mdit-py-plugins", "pygments"]

[project.urls]
Repository = "https://github.com/dfoulks1/oaken-core"
Issues = "https://github.com/dfoulks1/oaken-core/issues"

[project.scripts]
oaken = "oaken_core.cli.commands:main"

[project.entry-points."oaken_core.stores"]
sqlite = "oaken_core.store:SqliteStore"

[project.entry-points."oaken_core.vector_stores"]
sqlite-vec = "oaken_core.vec_sqlite:SqliteVecStore"

[project.entry-points."oaken_core.ingestors"]
items = "oaken_core.items:ItemsIngestor"

[project.entry-points."oaken_core.providers"]
socket = "oaken_core.providers.socket:SocketProvider"

[project.entry-points."oaken_core.triagers"]
nearjunk = "oaken_core.router.nearjunk:NearJunk"
dedupe = "oaken_core.triage.dedupe:DedupeTriager"
rules = "oaken_core.triage.rules:RulesTriager"
llm = "oaken_core.triage.llm:LlmTriager"

[project.entry-points."oaken_core.enrichers"]
llm = "oaken_core.enrich.llm:LlmEnricher"

[project.entry-points."oaken_core.formatters"]
json = "oaken_core.formatters.structured:JsonFormatter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaken_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
